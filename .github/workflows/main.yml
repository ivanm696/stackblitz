name: CI/CD Pipeline

# Указываем, при каких событиях запускается этот файл
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Скачиваем исходный код репозитория
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Шаг 2: Устанавливаем окружение Node.js
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # Шаг 3: Устанавливаем зависимости проекта
      - name: Install Dependencies
        run: npm ci

      # Шаг 4: Запускаем тесты (если они настроены в package.json)
      - name: Run Tests
        run: npm test --if-present

      # Шаг 5: Запускаем сборку проекта
      - name: Build Project
        run: npm run build --if-present
